{% extends "base.html" %}
{% block title %}Tambah User{% endblock %}
{% block content %}
<h3>Tambah User Baru</h3>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">Username *</label>
        <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" name="nama_lengkap" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Password *</label>
        <input type="password" name="password" class="form-control" minlength="8" required>
        <small class="text-muted">Minimal 8 karakter.</small>
    </div>
    <div class="mb-3">
        <label class="form-label">Role *</label>
        <select name="role" class="form-select" required>
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
            <option value="viewer">Viewer (read-only Data Buku)</option>
        </select>
            <div class="mb-3">
        <label class="form-label">Batasan Area (khusus role Viewer)</label>
        <select name="area_restriction" class="form-select">
            <option value="">-- Tidak dibatasi --</option>
            <option value="RED">🔴 RED saja</option>
            <option value="YELLOW">🟡 YELLOW saja</option>
            <option value="GREEN">🟢 GREEN saja</option>
        </select>
        <small class="text-muted">Kalau diisi, user cuma bisa lihat data area itu di Mapping Area & Dashboard. Cuma berlaku kalau role di atas diisi "Viewer".</small>
    </div>
    </div>
    <button type="submit" class="btn btn-primary">Simpan</button>
    <a href="{{ url_for('user_list') }}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
