{% extends "base.html" %}
{% block title %}Verifikasi 2FA{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card">
        <h3>Verifikasi 2FA</h3>
        <p class="subtitle">Masukkan kode 6 digit dari aplikasi authenticator kamu</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <input type="text" name="kode" class="form-control form-control-lg text-center" style="letter-spacing: .3em;"
                       inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verifikasi</button>
        </form>
    </div>
</div>
{% endblock %}
