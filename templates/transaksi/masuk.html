{% extends "base.html" %}
{% block title %}Barang Masuk{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Catat Barang Masuk</h3>
    <a href="{{ url_for('import_masuk_massal') }}" class="btn btn-outline-secondary btn-sm">📤 Import Massal (Excel)</a>
</div>

<form method="POST" id="form-masuk">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
        <label class="form-label">Scan ISBN</label>
        <div class="input-group">
            <input type="text" id="input-scan" class="form-control" placeholder="Scan atau ketik ISBN di sini">
            <button type="button" class="btn btn-outline-secondary" onclick="startCameraScanner('cameraModal', 'camera-reader', handleScanBuku)">
                📷 Scan Kamera
            </button>
        </div>
        <small class="text-muted" id="scan-status"></small>
    </div>

    <div class="mb-3 position-relative">
        <label class="form-label">Buku *</label>
        <input type="text" id="buku-search" class="form-control" placeholder="Ketik judul, ISBN, atau penulis untuk mencari..." autocomplete="off">
        <div id="buku-suggestions" class="list-group position-absolute w-100 shadow-sm" style="z-index: 1000; max-height: 280px; overflow-y: auto; display: none;"></div>
        <div id="buku-penerbit-info" class="mt-1 small text-muted" style="display: none;">
            Penerbit: <strong id="buku-penerbit-nama"></strong>
        </div>
        <select name="buku_id" id="select-buku" class="d-none">
            <option value="">-- Pilih Buku --</option>
            {% for buku in daftar_buku %}
            <option value="{{ buku.id }}" data-isbn="{{ buku.isbn }}" data-penerbit="{{ buku.penerbit or '-' }}">{{ buku.judul }} ({{ buku.isbn }}) — diterima {{ buku.stok }}/{{ buku.jumlah_rencana }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Jumlah Masuk *</label>
        <input type="number" name="jumlah" class="form-control" min="1" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Dari (supplier/donasi/dll)</label>
        <input type="text" name="pihak_terkait" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Keterangan</label>
        <textarea name="keterangan" class="form-control" rows="2"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Tanggal</label>
        <input type="date" name="tanggal" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Catat Barang Masuk</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Batal</a>
</form>

<script>
const inputScan = document.getElementById('input-scan');
const selectBuku = document.getElementById('select-buku');
const scanStatus = document.getElementById('scan-status');
const bukuSearch = document.getElementById('buku-search');
const bukuSuggestions = document.getElementById('buku-suggestions');
const allOptions = Array.from(selectBuku.options).filter(o => o.value !== '');

initPhysicalScanner(inputScan, handleScanBuku);

const penerbitInfo = document.getElementById('buku-penerbit-info');
const penerbitNama = document.getElementById('buku-penerbit-nama');

function tampilkanPenerbit(option) {
    if (option && option.dataset.penerbit) {
        penerbitNama.textContent = option.dataset.penerbit;
        penerbitInfo.style.display = 'block';
    } else {
        penerbitInfo.style.display = 'none';
    }
}

function handleScanBuku(kode) {
    inputScan.value = kode;
    const option = selectBuku.querySelector(`option[data-isbn="${kode}"]`);
    if (option) {
        selectBuku.value = option.value;
        bukuSearch.value = option.textContent;
        scanStatus.textContent = '✅ Ditemukan: ' + option.textContent;
        scanStatus.className = 'text-success';
        tampilkanPenerbit(option);
    } else {
        scanStatus.textContent = '❌ Buku dengan ISBN ini belum terdaftar di master data.';
        scanStatus.className = 'text-danger';
        tampilkanPenerbit(null);
    }
}

// pencarian buku manual dengan ketik
bukuSearch.addEventListener('input', function () {
    const kata = this.value.trim().toLowerCase();
    selectBuku.value = ''; // reset pilihan kalau user ngetik ulang
    tampilkanPenerbit(null);

    if (kata.length < 2) {
        bukuSuggestions.style.display = 'none';
        bukuSuggestions.innerHTML = '';
        return;
    }

    const hasil = allOptions.filter(o => o.textContent.toLowerCase().includes(kata)).slice(0, 20);

    if (hasil.length === 0) {
        bukuSuggestions.innerHTML = '<div class="list-group-item text-muted small">Tidak ditemukan.</div>';
    } else {
        bukuSuggestions.innerHTML = hasil.map(o =>
            `<button type="button" class="list-group-item list-group-item-action small" data-value="${o.value}">${o.textContent}</button>`
        ).join('');
    }
    bukuSuggestions.style.display = 'block';
});

bukuSuggestions.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-value]');
    if (!btn) return;
    selectBuku.value = btn.dataset.value;
    bukuSearch.value = btn.textContent;
    bukuSuggestions.style.display = 'none';
    bukuSuggestions.innerHTML = '';

    const option = selectBuku.querySelector(`option[value="${btn.dataset.value}"]`);
    tampilkanPenerbit(option);
});

// tutup daftar saran kalau klik di luar
document.addEventListener('click', function (e) {
    if (!bukuSearch.contains(e.target) && !bukuSuggestions.contains(e.target)) {
        bukuSuggestions.style.display = 'none';
    }
});

// validasi: pastikan buku sudah benar-benar dipilih sebelum submit
document.getElementById('form-masuk').addEventListener('submit', function (e) {
    if (!selectBuku.value) {
        e.preventDefault();
        alert('Pilih buku dulu dari hasil pencarian sebelum menyimpan.');
        bukuSearch.focus();
    }
});
</script>
{% endblock %}
